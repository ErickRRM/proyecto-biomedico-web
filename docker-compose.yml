services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: biomedico_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: biomedico
      POSTGRES_USER: biomedico_user
      POSTGRES_PASSWORD: biomedico_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: biomedico_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: biomedico_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: biomedico_minio
      MINIO_ROOT_PASSWORD: biomedico_minio_pass
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data: